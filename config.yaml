# Goldshine 설정 (마이클 에디션)
# 글과 4컷의 결은 아래 writing.rules, comic.rules 에서 바꿉니다.

site:
  title: Goldshine
  region: 서울 강남구 개포동

# 키워드 묶음. 점수(weight)가 높을수록 먼저 추천됩니다.
# category 이름은 홈페이지와 점수 기록에 그대로 쓰입니다.
tiers:
  - category: 개포단지
    weight: 10
    keywords: [개포동, 개포주공, 개포현대, 개포우성, 개포경남, 개포한신, 개포자이, 래미안블레스티지, 래미안 블레스티지,
               디에이치아너힐즈, 디에이치 퍼스티어, 디에이치퍼스티어, 퍼스티어 아이파크, 일원한솔, 개포프레지던스자이, 개포래미안포레스트, 일원동, 대치동 재건축]
  - category: 강남시세
    weight: 6
    keywords: [강남 집값, 강남구 아파트, 강남 아파트, 강남3구, 강남 재건축, 대치동, 도곡동, 수서동, 압구정, 반포]
  - category: 정책·이슈
    weight: 4
    keywords: [부동산 정책, 대출 규제, 주택담보대출, 토지거래허가, 재건축 초과이익, 보유세, 종부세, 양도세,
               공시가격, 분양가 상한제, 전세, 금리 인하, 부동산 대책]

# 기사 제목이나 요약에 이 단어가 들어가면 후보에서 뺍니다.
exclude: [오피스텔 분양 광고, 모델하우스 오픈, 포토, 인사, 부고]

# 국토부 실거래가 (PUBLIC_DATA_API_KEY 가 있을 때만)
deals:
  lawd_cd: "11680"     # 강남구 법정동 코드 앞 5자리
  dong: 개포동          # 이 동의 거래만 모읍니다
  days: 14             # 최근 며칠 거래를 카드로 만들지

# AI 초안 (ANTHROPIC_API_KEY 가 있을 때만)
ai:
  model: claude-opus-5-5
  effort: medium
  candidates_to_send: 9   # AI에게 보여줄 후보 기사 수

# Gemini (GEMINI_API_KEY 가 있고 ANTHROPIC_API_KEY 가 없을 때)
# Google AI Studio(aistudio.google.com)에서 무료 키를 받습니다.
# 위에서부터 차례로 시도합니다. 모델이 없어지거나 무료 한도를 넘으면 다음 모델로 넘어갑니다.
# AI Studio의 모델 목록에서 이름을 확인해 바꿔 넣으세요.
gemini:
  models: [gemini-3.5-flash, gemini-3-flash-preview, gemini-3.1-flash-lite]

# 글 쓰는 방식 (AI에게 주는 추가 규칙)
writing:
  rules: |
    『묘사의 힘』을 따른다. 말하지 말고 보여준다.
    주어와 술어 중심의 짧은 문장. 한 문장에 한 가지만.
    해설 대신 오감 묘사, 구체적 이미지, 행동으로 장면을 세운다.
    감정은 이름 붙이지 않는다. 표정, 손짓, 침묵으로 느끼게 한다.
    비유, 짧은 내적 독백, 대화를 적극 쓴다.
    어른의 아이러니를 녹인다. 반항, 성장, 혼란, 실수, 성찰.
    집값 이야기 밑에 사람 이야기가 흐르게 한다. 숫자는 장면 속 소품처럼 놓는다.
    마지막 "중개사 한마디"만은 실무적으로, 짧고 정확하게 쓴다.

# 4컷 만화 바꾸기 (자세한 방법은 README 「4컷 만화 바꾸기」)
comic:
  title: 개포동 사무실 4컷      # 만화 맨 위 제목
  guest: 손님                   # 말풍선 왼쪽 인물 이름 (화면 표시용)
  boss: 사장님                  # 말풍선 오른쪽 인물 이름 (화면 표시용)
  color: "#f2cf3d"              # 4컷째 숫자 칸 색
  # AI에게 주는 4컷 추가 규칙. 여러 줄로 자유롭게 적습니다.
  rules: |
    무대는 늘 개포동 사무실이다. 같은 사장님, 매일 다른 손님.
    사장님은 키가 크고 예쁘며 피부가 고운 중년 여성이다. 밝고 다정한 성격이다. 안경은 쓰지 않는다.
    블로그 글과 같은 기사, 같은 세계를 다룬다. 글의 한 장면을 4컷으로 옮긴다고 생각한다.
    1컷은 손님의 질문이나 혼잣말 한 줄로 연다.
    2~3컷에서 기대와 현실이 엇갈린다. 3컷에 작은 반전이나 머쓱한 침묵을 둔다.
    4컷은 기사에서 가장 놀라운 숫자 하나와, 웃기지만 씁쓸한 사장님의 한마디로 닫는다.
    대사는 짧게. 설명하는 대사는 쓰지 않는다. 장면(scene)은 행동과 사물로 쓴다.

# 학습: 점수가 쌓이면 유형별 가중치를 조정합니다.
learning:
  prior_count: 2     # 기록이 적을 때 과하게 흔들리지 않도록 3점을 이만큼 깔아 둡니다
