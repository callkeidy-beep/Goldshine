name: 점수·출처 반영

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: gaepo-data
  cancel-in-progress: false

jobs:
  apply:
    # 저장소 주인이 쓴 것만 반영합니다 (공개 저장소에서 다른 사람이 점수를 바꾸지 못하게)
    if: >-
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner &&
        (startsWith(github.event.issue.title, '[점수]') || startsWith(github.event.issue.title, '[출처'))) ||
      (github.event_name == 'issue_comment' && github.event.comment.user.login == github.repository_owner &&
        (startsWith(github.event.issue.title, '[Goldshine]') || startsWith(github.event.issue.title, '[개포 데일리]')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 반영
        id: apply
        working-directory: scripts
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || github.event.issue.body }}
        run: python feedback.py | tee ../result.txt

      - name: 저장
        run: |
          git config user.name "goldshine"
          git config user.email "goldshine@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "점수·출처 반영"
          git pull --rebase --autostash
          git push

      - name: 결과 댓글
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          EVENT: ${{ github.event_name }}
        run: |
          gh issue comment "$NUM" --body-file result.txt
          if [ "$EVENT" = "issues" ]; then gh issue close "$NUM"; fi
