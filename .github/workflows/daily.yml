name: Goldshine (매일 아침)

on:
  schedule:
    # 정각·30분은 GitHub 예약이 몰려 몇 시간씩 밀리므로 어중간한 분으로 둡니다
    - cron: "47 20 * * *"   # 한국 시간 오전 5시 47분
    - cron: "13 22 * * *"   # 오전 7시 13분 (예비)
    - cron: "41 23 * * *"   # 오전 8시 41분 (예비)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: gaepo-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 오늘 이미 만들었는지 확인 (예비 실행용)
        id: guard
        run: |
          DAY=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "docs/data/days/${DAY}.json" ]; then
            echo "오늘(${DAY}) 추천이 이미 있습니다. 예비 실행을 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: 패키지 설치
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 기사·실거래 수집
        if: steps.guard.outputs.skip != 'true'
        working-directory: scripts
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_NEWS_CLIENT_ID: ${{ secrets.NAVER_NEWS_CLIENT_ID }}
          NAVER_NEWS_CLIENT_SECRET: ${{ secrets.NAVER_NEWS_CLIENT_SECRET }}
        run: python collect.py

      - name: 오늘의 3편 만들기
        if: steps.guard.outputs.skip != 'true'
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python make_daily.py

      - name: 저장
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "goldshine"
          git config user.email "goldshine@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "오늘의 추천 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase --autostash
          git push

      - name: 휴대폰 알림용 이슈
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY=$(TZ=Asia/Seoul date +%F)
          OWNER=${GITHUB_REPOSITORY%%/*}; REPO=${GITHUB_REPOSITORY#*/}
          URL="https://${OWNER}.github.io/${REPO}/"
          printf '오늘의 3편이 올라왔습니다.\n\n%s\n\n이 이슈에 댓글로 점수를 달아도 됩니다. 글은 `1:4 2:3 3:5`, 4컷은 `c1:5 c2:3 c3:4`.\n' "$URL" > body.md
          # 같은 날 다시 돌려도 알림 이슈는 하나만
          if gh issue list --state all --search "${DAY} in:title" --json title --jq '.[].title' | grep -qE "^\[(Goldshine|개포 데일리)\] ${DAY}$"; then
            echo "오늘 알림 이슈가 이미 있습니다"
          else
            gh issue create --title "[Goldshine] ${DAY}" --body-file body.md || true
          fi
